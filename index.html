<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offer Poster Studio — Admin</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#132420;--teal:#0E6E5D;--gold:#CC9A3C;--coral:#E1553B;--cream:#FBF6EA;--cream2:#F3ECDA;--line:#E3DBC6;--muted:#6b7a74;--paper:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--cream2);color:var(--ink);font-size:14px}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}header small{opacity:.7}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:4}
nav button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--cream);padding:8px 13px;border-radius:99px;font-weight:700;font-size:12.5px;cursor:pointer}
nav button.on{background:var(--teal);border-color:var(--teal);color:#fff}
main{padding:14px;max-width:1100px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;color:var(--muted);text-transform:uppercase}
.tw{overflow-x:auto}
input,select,textarea{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--cream);max-width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0}
label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.btn{border:none;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--teal);color:#fff;font-size:13px}
.btn.o{background:var(--cream);color:var(--ink);border:1.5px solid var(--line)}.btn.d{background:var(--coral)}.btn.s{padding:5px 9px;font-size:11.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}
img.th{width:46px;height:46px;object-fit:cover;border-radius:8px;background:#eee}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;background:var(--cream2)}
.tag.premium{background:#1c1204;color:#FACC15}.tag.business{background:#4C1D95;color:#fff}.tag.bad{background:var(--coral);color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;display:none;max-width:90vw}
#toast.err{background:var(--coral)}
.login{max-width:360px;margin:60px auto}.hint{font-size:12px;color:var(--muted);line-height:1.5}
pre{white-space:pre-wrap;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;max-height:340px;overflow:auto}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://peftmuasykbcrhtkhhjf.supabase.co', SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZnRtdWFzeWtiY3JodGtoaGpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MzkzMTIsImV4cCI6MjEwMTMxNTMxMn0.oiFn_41F-jBxK8tizA3qPoC1UPJPC72SvNxyxiUlhGY';
const SQL_TEXT="-- SAFE-FOR-LIVE VERSION: only ADDS things. It does not delete data, does not enable RLS on your existing tables,\n-- and re-running it is harmless. If any statement fails, the SQL editor rolls the whole script back (nothing changes).\n-- Existing policies are untouched; the new \"admin ...\" policies only ADD access for users with profiles.is_admin = true.\n-- Run once in Supabase \u2192 SQL editor. Review before running.\nalter table profiles add column if not exists is_admin boolean default false;\n-- make yourself admin (replace the email):\n-- update profiles set is_admin = true where email = 'you@example.com';\n\ncreate or replace function is_studio_admin() returns boolean language sql stable security definer as $$\n  select coalesce((select is_admin from profiles where id = auth.uid()), false) $$;\n\n-- Design Studio cloud designs (per user)\ncreate table if not exists studio_designs (\n  id uuid primary key, user_id uuid references auth.users(id) on delete cascade,\n  name text, width int, height int, thumb text, doc jsonb, updated_at timestamptz default now());\nalter table studio_designs enable row level security;\ndrop policy if exists \"own studio designs\" on studio_designs;\ncreate policy \"own studio designs\" on studio_designs for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\n\n-- Admin-managed content\ncreate table if not exists studio_templates (\n  id uuid primary key default gen_random_uuid(), name text, cat text, premium boolean default false,\n  tags text, thumb text, doc jsonb, created_at timestamptz default now());\ncreate table if not exists studio_fonts (\n  id uuid primary key default gen_random_uuid(), label text, css text, url text);\nalter table studio_templates enable row level security;\nalter table studio_fonts enable row level security;\ndrop policy if exists \"read templates\" on studio_templates;\ncreate policy \"read templates\" on studio_templates for select using (auth.role() = 'authenticated');\ndrop policy if exists \"admin templates\" on studio_templates;\ncreate policy \"admin templates\" on studio_templates for all using (is_studio_admin()) with check (is_studio_admin());\ndrop policy if exists \"read fonts\" on studio_fonts;\ncreate policy \"read fonts\" on studio_fonts for select using (auth.role() = 'authenticated');\ndrop policy if exists \"admin fonts\" on studio_fonts;\ncreate policy \"admin fonts\" on studio_fonts for all using (is_studio_admin()) with check (is_studio_admin());\n\n-- Let admins manage users, settings, payments and graphics (adjust if you already have policies)\ndrop policy if exists \"admin read profiles\" on profiles;\ncreate policy \"admin read profiles\" on profiles for select using (is_studio_admin());\ndrop policy if exists \"admin update profiles\" on profiles;\ncreate policy \"admin update profiles\" on profiles for update using (is_studio_admin());\ndrop policy if exists \"admin settings\" on settings;\ncreate policy \"admin settings\" on settings for all using (is_studio_admin()) with check (is_studio_admin());\ndrop policy if exists \"admin read payments\" on payments;\ncreate policy \"admin read payments\" on payments for select using (is_studio_admin());\ndrop policy if exists \"admin graphics\" on store_assets;\ncreate policy \"admin graphics\" on store_assets for all using (is_studio_admin()) with check (is_studio_admin());\n\n-- ---- Admin panel (admin.html) additions: all additive ----\nalter table settings add column if not exists free_video_limit int default 1;\nalter table settings add column if not exists free_save_limit int default 1;\nalter table settings add column if not exists price_month1 numeric;\nalter table settings add column if not exists price_month6 numeric;\ndrop policy if exists \"admin templates write\" on templates;\ncreate policy \"admin templates write\" on templates for all using (is_studio_admin()) with check (is_studio_admin());\ndrop policy if exists \"admin categories write\" on categories;\ncreate policy \"admin categories write\" on categories for all using (is_studio_admin()) with check (is_studio_admin());\ndrop policy if exists \"admin read downloads\" on downloads_log;\ncreate policy \"admin read downloads\" on downloads_log for select using (is_studio_admin());\ndrop policy if exists \"admin read studio designs\" on studio_designs;\ncreate policy \"admin read studio designs\" on studio_designs for select using (is_studio_admin());\n\n-- ---- Plans managed from the admin panel (price, duration, download allowance) ----\ncreate table if not exists plans (\n  id text primary key, name text not null, price numeric not null, months int default 1,\n  download_limit int,   -- images/PDFs included in the plan (NULL = unlimited)\n  video_limit int,      -- videos included (NULL = unlimited)\n  note text, badge boolean default false, active boolean default true, sort int default 0);\ninsert into plans (id, name, price, months, note, badge, sort) values\n  ('month1', '1 Month', 299, 1, 'One month of Premium access', false, 1),\n  ('month6', '6 Months', 999, 6, 'Six months of Premium access \u2014 best value', true, 2)\non conflict (id) do nothing;\nalter table plans enable row level security;\ndrop policy if exists \"read plans\" on plans;\ncreate policy \"read plans\" on plans for select using (true);\ndrop policy if exists \"admin plans\" on plans;\ncreate policy \"admin plans\" on plans for all using (is_studio_admin()) with check (is_studio_admin());\nalter table profiles add column if not exists plan_download_limit int;\nalter table profiles add column if not exists plan_video_limit int;\nalter table profiles add column if not exists plan_started_at timestamptz;\nalter table profiles add column if not exists plan_id text;\nalter table settings add column if not exists razorpay_key_id text;\nalter table settings add column if not exists razorpay_webhook_on boolean default false;\n\n-- Plans end automatically: when plan_expires_at has passed the user goes back to Free (runs on every site load).\ncreate or replace function expire_plans() returns void language sql security definer as $$\n  update profiles set plan = 'free' where plan <> 'free' and plan_expires_at is not null and plan_expires_at < now() $$;\n";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null, TAB='overview', CATS=[];
function toast(m,err){const t=$('toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
async function run(p,ok){const r=await p;if(r.error){toast(r.error.message,true)}else if(ok)toast(ok);return r}
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');

// ---------- auth ----------
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof) return denied('Could not read your profile: '+(error?error.message:'not found'));
  if(prof.is_admin!==true) return denied('This account ('+esc(prof.email||session.user.email)+') is not an admin.');
  ME=prof; shell();
}
function loginView(){ $('app').innerHTML=`<div class="login card"><h2>Admin sign-in</h2>
  <label>Email</label><input id="em" type="email" style="width:100%"><label>Password</label><input id="pw" type="password" style="width:100%">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="login()">Sign in</button><button class="btn o" onclick="google()">Google</button></div>
  <p class="hint">Only accounts with <b>profiles.is_admin = true</b> can use this panel.</p></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return toast(error.message,true);init()}
async function google(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)toast(error.message,true)}
function denied(msg){$('app').innerHTML=`<div class="login card"><h2>Access denied</h2><p>${msg}</p><p class="hint">To make an account admin, run in Supabase SQL editor:<br><code>update profiles set is_admin = true where email = 'you@example.com';</code></p><button class="btn o" onclick="logout()">Sign out</button></div>`}
async function logout(){await sb.auth.signOut();location.reload()}

// ---------- shell ----------
const TABS=[['overview','Overview'],['users','Users & Plans'],['templates','Poster Templates'],['studiot','Studio Templates'],['categories','Categories'],['graphics','Graphics'],['fonts','Fonts'],['plans','Plans & Prices'],['settings','Pricing & Limits'],['payments','Payments'],['sql','Setup SQL']];
function shell(){
  $('app').innerHTML=`<header><h1>Offer Poster Studio · Admin <small>${esc(ME.email||'')}</small></h1><a href="index.html" style="color:#fff;font-size:12px">← Site</a><button class="btn o s" onclick="logout()">Sign out</button></header>
  <nav>${TABS.map(([k,l])=>`<button id="t_${k}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main id="main"></main>`;
  go(TAB);
}
async function go(t){TAB=t;TABS.forEach(([k])=>$('t_'+k).classList.toggle('on',k===t));$('main').innerHTML='<div class="card">Loading…</div>';try{await PANELS[t]()}catch(e){$('main').innerHTML=`<div class="card"><b>Error</b><p>${esc(e.message||e)}</p><p class="hint">If a table or policy is missing, run the SQL in “Setup SQL”.</p></div>`}}
async function count(t,f){let q=sb.from(t).select('id',{count:'exact',head:true});if(f)q=f(q);const r=await q;return r.error?'—':r.count}
const paint=h=>{$('main').innerHTML=h};
async function loadCats(){const r=await sb.from('categories').select('*').order('label');CATS=r.data||[]}

const PANELS={
async overview(){
  const [u,fr,pr,bz,tp,te,sd,dl,dt,pc]=await Promise.all([count('profiles'),count('profiles',q=>q.eq('plan','free')),count('profiles',q=>q.eq('plan','premium')),count('profiles',q=>q.eq('plan','business')),count('templates'),count('templates',q=>q.eq('enabled',true)),count('studio_designs'),count('downloads_log'),count('downloads_log',q=>q.gte('created_at',today()+'T00:00:00')),count('payments')]);
  const pay=await sb.from('payments').select('amount,status').limit(1000);const total=(pay.data||[]).filter(p=>!p.status||p.status==='completed').reduce((a,p)=>a+Number(p.amount||0),0);
  const S=[['Users',u],['Free',fr],['Premium',pr],['Business',bz],['Poster templates',tp],['Enabled templates',te],['Studio designs (cloud)',sd],['Downloads (all)',dl],['Downloads today',dt],['Payments',pc],['Revenue (completed)',money(total)]];
  paint(`<div class="card"><h2>Overview</h2><div class="grid">${S.map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div></div>`)},

async users(){
  const q=($('uq')&&$('uq').value||'').trim().toLowerCase();
  const r=await sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;
  const dl=await sb.from('downloads_log').select('user_id,format,created_at').order('created_at',{ascending:false}).limit(30000);
  const S={};(dl.data||[]).forEach(d=>{const s=S[d.user_id]||(S[d.user_id]={all:0,vid:0,today:0,last:null});s.all++;if(d.format==='studio-video')s.vid++;if(new Date(d.created_at).toDateString()===new Date().toDateString())s.today++;if(!s.last)s.last=d.created_at});
  window._DLS=dl.data||[];
  const list=r.data.filter(u=>!q||((u.email||'')+(u.shop_name||'')).toLowerCase().includes(q));
  const fd=x=>x?new Date(x).toLocaleDateString():'—', now=Date.now();
  const left=(u,s)=>{if(u.plan==='free'||u.plan_download_limit==null||!u.plan_started_at)return u.plan==='free'?'—':'unlimited';const used=(dl.data||[]).filter(d=>d.user_id===u.id&&d.format!=='studio-video'&&new Date(d.created_at)>=new Date(u.plan_started_at)).length;return Math.max(0,u.plan_download_limit-used)+' left'};
  paint(`<div id="ulog"></div><div class="card"><h2>Users & plans (${list.length})</h2><p class="hint">Joined date, downloads and plan status of every user. “Downloads” counts all images/PDFs/videos each user has exported.</p><div class="row"><input id="uq" placeholder="Search email / shop" value="${esc(q)}" oninput="clearTimeout(window._u);window._u=setTimeout(PANELS.users,300)"></div>
  <div class="tw"><table><tr><th>User</th><th>Joined</th><th>Downloads<br><small>total · video · today</small></th><th>Last download</th><th>Plan</th><th>Expires</th><th>Quota</th><th>Quick grant</th><th>Status</th><th>Admin</th></tr>${list.map(u=>{const s=S[u.id]||{all:0,vid:0,today:0,last:null};const exp=u.plan_expires_at?new Date(u.plan_expires_at):null;const days=exp?Math.ceil((exp-now)/86400000):null;return`<tr>
   <td><b>${esc(u.shop_name||'—')}</b><br><small>${esc(u.email||u.id.slice(0,8))}</small></td>
   <td>${fd(u.created_at)}</td>
   <td><b>${s.all}</b> · ${s.vid} · ${s.today} <button class="btn s o" onclick="userLog('${u.id}')">History</button></td>
   <td>${fd(s.last)}</td>
   <td><select onchange="upd('profiles','${u.id}',{plan:this.value})">${['free','premium','business'].map(p=>`<option ${u.plan===p?'selected':''}>${p}</option>`).join('')}</select></td>
   <td>${exp?fd(u.plan_expires_at)+(u.plan!=='free'&&days!==null?`<br><small style="color:${days<=7?'#b91c1c':'inherit'}">${days>0?days+' days left':'expired'}</small>`:(days!==null&&days<=0?'<br><small>expired</small>':'')):'—'}</td>
   <td>${left(u,s)}</td>
   <td><button class="btn s o" onclick="grant('${u.id}',1)">+1 month</button> <button class="btn s o" onclick="grant('${u.id}',6)">+6 months</button></td>
   <td><button class="btn s ${u.suspended?'d':'o'}" onclick="upd('profiles','${u.id}',{suspended:${!u.suspended}},1)">${u.suspended?'Suspended — restore':'Active — suspend'}</button></td>
   <td><input type="checkbox" ${u.is_admin?'checked':''} onchange="if(confirm('Change admin access for this user?'))upd('profiles','${u.id}',{is_admin:this.checked});else this.checked=!this.checked"></td></tr>`}).join('')}</table></div></div>`)},

async templates(){
  await loadCats();const r=await sb.from('templates').select('*').order('created_at',{ascending:false}).limit(300);if(r.error)throw r.error;
  paint(`<div class="card"><h2>Poster-editor templates (${r.data.length})</h2><p class="hint">These appear in the Templates gallery. Toggle visibility / premium / featured, rename, change category or delete. (To create a new template visually, build it in the poster editor.)</p>
  <div class="tw"><table><tr><th></th><th>Title</th><th>Category</th><th>On</th><th>Premium</th><th>Featured</th><th>Trending</th><th>Festival</th><th></th></tr>${r.data.map(t=>`<tr>
   <td>${t.thumb_url?`<img class="th" src="${esc(t.thumb_url)}">`:''}</td>
   <td><input value="${esc(t.title||t.name||'')}" style="width:150px" onchange="upd('templates','${t.id}',{title:this.value})"></td>
   <td><select onchange="upd('templates','${t.id}',{category_id:this.value||null})"><option value="">—</option>${CATS.map(c=>`<option value="${c.id}" ${c.id===t.category_id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></td>
   ${['enabled','premium','featured','trending','festival'].map(k=>`<td><input type="checkbox" ${t[k]?'checked':''} onchange="upd('templates','${t.id}',{${k}:this.checked})"></td>`).join('')}
   <td><button class="btn s d" onclick="del('templates','${t.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`)},

async studiot(){
  const r=await sb.from('studio_templates').select('id,name,cat,premium,tags,thumb,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;
  paint(`<div class="card"><h2>Design Studio templates (${r.data.length})</h2><div class="card" style="background:#f8fafc"><h3 style="margin:0 0 6px">＋ Add a template from an image</h3><p class="hint">Make the design anywhere (e.g. a business card or logo layout as PNG/JPG), upload it here — users get it in Studio → Templates and can add their own text and logo over it. For fully editable text, use the in-Studio method below.</p>
  <div class="row"><input id="tn" placeholder="Template name"><select id="tk">${TPL_KINDS.map((k,i)=>`<option value="${i}">${k[0]}</option>`).join('')}</select><input id="tc" placeholder="Category (e.g. Business Cards)"><input id="tg" placeholder="Tags"><label><input type="checkbox" id="tp"> Premium</label></div>
  <div class="row" style="margin-top:8px"><input type="file" id="tf" accept="image/*"><button class="btn" onclick="addTemplateImage()">＋ Add template</button></div></div>
  <p class="hint">Add new fully-editable ones inside the Studio: open a design → Makers & Tools → Admin → Templates → “Add current design as template”. They show for every user in Studio → Templates, with the category and tags you enter.</p>
  <div class="tw"><table><tr><th></th><th>Name</th><th>Category</th><th>Tags</th><th>Premium</th><th></th></tr>${r.data.map(t=>`<tr><td>${t.thumb?`<img class="th" src="${t.thumb}">`:''}</td>
   <td><input value="${esc(t.name)}" style="width:150px" onchange="upd('studio_templates','${t.id}',{name:this.value})"></td>
   <td><input value="${esc(t.cat||'')}" style="width:120px" onchange="upd('studio_templates','${t.id}',{cat:this.value})"></td>
   <td><input value="${esc(t.tags||'')}" style="width:150px" onchange="upd('studio_templates','${t.id}',{tags:this.value})"></td>
   <td><input type="checkbox" ${t.premium?'checked':''} onchange="upd('studio_templates','${t.id}',{premium:this.checked})"></td>
   <td><button class="btn s d" onclick="del('studio_templates','${t.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`)},

async categories(){
  await loadCats();
  paint(`<div class="card"><h2>Categories (${CATS.length})</h2><div class="row"><input id="nc" placeholder="New category name"><input id="ni" placeholder="Icon / emoji" style="width:90px"><button class="btn" onclick="addCat()">＋ Add</button></div>
  <div class="tw"><table><tr><th>Icon</th><th>Name</th><th></th></tr>${CATS.map(c=>`<tr><td><input value="${esc(c.icon||'')}" style="width:70px" onchange="upd('categories','${c.id}',{icon:this.value})"></td><td><input value="${esc(c.label)}" onchange="upd('categories','${c.id}',{label:this.value})"></td><td><button class="btn s d" onclick="del('categories','${c.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`)},

async graphics(){
  const r=await sb.from('store_assets').select('*').order('created_at',{ascending:false}).limit(300);if(r.error)throw r.error;
  const TY=['sticker','badge','festival_decoration','offer_label','price_tag'];
  paint(`<div class="card"><h2>Graphics & stickers (${r.data.length})</h2><p class="hint">Shown in the poster editor and in Studio → Elements. Use transparent PNG.</p>
  <div class="row"><select id="gt">${TY.map(t=>`<option>${t}</option>`).join('')}</select><input id="gu" placeholder="Image URL (https://…)" style="min-width:220px"><button class="btn" onclick="addGraphic()">＋ Add URL</button><span>or</span><input type="file" id="gf" accept="image/*" multiple><button class="btn o" onclick="uploadGraphics()">Upload files</button></div>
  <div class="grid" style="margin-top:12px">${r.data.map(g=>`<div class="stat" style="text-align:center"><img src="${esc(g.image_url)}" style="width:100%;height:90px;object-fit:contain"><div class="row" style="justify-content:center;margin-top:6px"><select onchange="upd('store_assets','${g.id}',{type:this.value})">${TY.map(t=>`<option ${g.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="row" style="justify-content:center;margin-top:6px"><label style="margin:0"><input type="checkbox" ${g.enabled!==false?'checked':''} onchange="upd('store_assets','${g.id}',{enabled:this.checked})"> on</label><button class="btn s d" onclick="del('store_assets','${g.id}')">✕</button></div></div>`).join('')}</div></div>`)},

async fonts(){
  const r=await sb.from('studio_fonts').select('*');if(r.error)throw r.error;
  paint(`<div class="card"><h2>Studio fonts (${r.data.length})</h2><p class="hint">Add a Google Font: label, CSS family and its stylesheet link. It appears in every Studio font list.</p>
  <div class="row"><input id="fl" placeholder="Display name"><input id="fc" placeholder="CSS family e.g. 'Chilanka',cursive"><input id="fu" placeholder="https://fonts.googleapis.com/css2?family=…" style="min-width:260px"><button class="btn" onclick="addFont()">＋ Add</button></div>
  <div class="tw"><table><tr><th>Name</th><th>CSS</th><th></th></tr>${r.data.map(f=>`<tr><td>${esc(f.label)}</td><td><small>${esc(f.css)}</small></td><td><button class="btn s d" onclick="del('studio_fonts','${f.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`)},

async plans(){
  const r=await sb.from('plans').select('*').order('sort',{ascending:true});if(r.error)throw r.error;
  paint(`<div class="card"><h2>Plans & prices (${r.data.length})</h2>
  <p class="hint">Set what each plan costs and how many downloads it includes. <b>Leave a limit blank = unlimited.</b> Example: ₹99 → 20 downloads, 1 month. Users see only <b>active</b> plans on the pricing page. Free-plan limits are in “Pricing & Limits”.</p>
  <div class="tw"><table><tr><th>ID</th><th>Name</th><th>Price ₹</th><th>Months</th><th>Image/PDF downloads</th><th>Video downloads</th><th>Note</th><th>Best value</th><th>Active</th><th>Order</th><th></th></tr>
  ${r.data.map(p=>`<tr><td><small>${esc(p.id)}</small></td>
   <td><input value="${esc(p.name)}" style="width:110px" onchange="upd('plans','${esc(p.id)}',{name:this.value})"></td>
   <td><input type="number" min="1" value="${p.price}" style="width:70px" onchange="upd('plans','${esc(p.id)}',{price:Number(this.value)})"></td>
   <td><input type="number" min="1" value="${p.months||1}" style="width:60px" onchange="upd('plans','${esc(p.id)}',{months:Number(this.value)})"></td>
   <td><input type="number" min="0" value="${p.download_limit==null?'':p.download_limit}" placeholder="unlimited" style="width:90px" onchange="upd('plans','${esc(p.id)}',{download_limit:this.value===''?null:Number(this.value)})"></td>
   <td><input type="number" min="0" value="${p.video_limit==null?'':p.video_limit}" placeholder="unlimited" style="width:90px" onchange="upd('plans','${esc(p.id)}',{video_limit:this.value===''?null:Number(this.value)})"></td>
   <td><input value="${esc(p.note||'')}" style="width:170px" onchange="upd('plans','${esc(p.id)}',{note:this.value})"></td>
   <td><input type="checkbox" ${p.badge?'checked':''} onchange="upd('plans','${esc(p.id)}',{badge:this.checked})"></td>
   <td><input type="checkbox" ${p.active!==false?'checked':''} onchange="upd('plans','${esc(p.id)}',{active:this.checked})"></td>
   <td><input type="number" value="${p.sort||0}" style="width:55px" onchange="upd('plans','${esc(p.id)}',{sort:Number(this.value)})"></td>
   <td><button class="btn s d" onclick="del('plans','${esc(p.id)}')">Delete</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Add a plan</h2><div class="row">
   <input id="np_id" placeholder="id (e.g. pack20)" style="width:120px"><input id="np_name" placeholder="Name (e.g. 20 Downloads)" style="width:170px">
   <input id="np_price" type="number" placeholder="Price ₹" style="width:90px"><input id="np_months" type="number" placeholder="Months" value="1" style="width:80px">
   <input id="np_dl" type="number" placeholder="Downloads (blank = unlimited)" style="width:200px"><input id="np_vl" type="number" placeholder="Videos (blank = unlimited)" style="width:200px">
   <input id="np_note" placeholder="Note" style="min-width:160px"><button class="btn" onclick="addPlan()">＋ Add plan</button></div>
  <p class="hint">Downloads are counted from the day the user buys. Buying another plan adds the leftover downloads. If the “plans” table is missing, run “Setup SQL”.</p></div>`)},

async settings(){
  const r=await sb.from('settings').select('*').eq('id',1).single();if(r.error)throw r.error;const s=r.data;
  const F=[['free_download_limit','Free image downloads per day (poster editor + Studio)'],['free_video_limit','Free video downloads per day'],['free_save_limit','Free saved Studio designs (total)'],['watermark_text','Watermark text on free exports'],['razorpay_webhook_on','Server activation via webhook (true / false) — set true only after the webhook is deployed'],['razorpay_key_id','Razorpay Key ID (rzp_test_… or rzp_live_…) — never put the Key Secret here'],['price_month1','Old 1-month price (₹) — ignored once Plans has rows'],['price_month6','Old 6-month price (₹) — ignored once Plans has rows']];
  const known=F.map(f=>f[0]).concat(['id','demo_templates_seeded']);const others=Object.keys(s).filter(k=>!known.includes(k)&&typeof s[k]!=='object');
  paint(`<div class="card"><h2>Pricing & limits</h2><p class="hint">Changes apply to everyone on next page load. A blank price uses the built-in default (₹299 / ₹999). If a field is missing from the form below, run the “Setup SQL” once.</p>
  ${F.map(([k,l])=>k in s?`<label>${l}</label><input data-k="${k}" value="${esc(s[k])}">`:`<label>${l}</label><input disabled placeholder="column missing — run Setup SQL"><br>`).join('')}
  ${others.length?'<h2 style="margin-top:16px">Other settings</h2>'+others.map(k=>`<label>${esc(k)}</label><input data-k="${esc(k)}" value="${esc(s[k])}">`).join(''):''}
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveSettings()">Save</button></div></div>
  <div class="card"><h2>Payments note</h2><p class="hint">Plans are activated by the website after a Razorpay payment. Only the public Razorpay Key ID is stored (field above); the Key Secret must never go in the website. Before relying on this for real money, verify payments on a server (webhook) — the browser-side activation can be abused.</p></div>`)},

async payments(){
  const r=await sb.from('payments').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)throw r.error;
  const cols=r.data[0]?Object.keys(r.data[0]).filter(k=>!/signature|raw/i.test(k)):[];
  const total=r.data.filter(p=>!p.status||p.status==='completed').reduce((a,p)=>a+Number(p.amount||0),0);
  paint(`<div class="card"><h2>Payments (${r.data.length}) · completed total ${money(total)}</h2>${r.data.length?`<div class="tw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.data.map(p=>`<tr>${cols.map(c=>`<td>${esc(typeof p[c]==='object'?JSON.stringify(p[c]):String(p[c]).slice(0,40))}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="hint">No payments yet.</p>'}</div>`)},

async sql(){paint(`<div class="card"><h2>Setup SQL</h2><p class="hint">Run once in Supabase → SQL editor (safe to re-run; only adds things). It adds the admin flag, Studio tables, plans table, admin permissions and the new settings columns.</p><pre id="sqlbox">${esc(SQL_TEXT)}</pre><button class="btn" onclick="navigator.clipboard.writeText(SQL_TEXT).then(()=>toast('SQL copied'))">Copy SQL</button></div>`)}
};

// ---------- actions ----------
async function upd(table,id,patch,reload){const r=await run(sb.from(table).update(patch).eq('id',id),'Saved');if(!r.error&&reload)go(TAB)}
async function del(table,id){if(!confirm('Delete permanently?'))return;const r=await run(sb.from(table).delete().eq('id',id),'Deleted');if(!r.error)go(TAB)}
async function grant(id,months){const {data:u}=await sb.from('profiles').select('plan_expires_at,plan').eq('id',id).single();const base=u&&u.plan_expires_at&&new Date(u.plan_expires_at)>new Date()?new Date(u.plan_expires_at):new Date();base.setMonth(base.getMonth()+months);const r=await run(sb.from('profiles').update({plan:'premium',plan_expires_at:base.toISOString()}).eq('id',id),'Premium until '+base.toLocaleDateString());if(!r.error)go('users')}
function userLog(id){const rows=(window._DLS||[]).filter(d=>d.user_id===id).slice(0,100);const el=$('ulog');if(!el)return;el.innerHTML=`<div class="card"><h2>Download history (latest ${rows.length})</h2>${rows.length?`<div class="tw"><table><tr><th>When</th><th>Type</th></tr>${rows.map(d=>`<tr><td>${new Date(d.created_at).toLocaleString()}</td><td>${esc(d.format||'—')}</td></tr>`).join('')}</table></div>`:'<p class="hint">No downloads yet.</p>'}<button class="btn o s" onclick="$('ulog').innerHTML=''">Close</button></div>`;el.scrollIntoView({behavior:'smooth'})}
const TPL_KINDS=[['Business card (3.5×2 in)',1050,600,{w:88.9,h:50.8},'card'],['Logo (square)',1000,1000,null,'logo'],['Instagram post (1:1)',1080,1080,null,'design'],['Instagram story / reel (9:16)',1080,1920,null,'design'],['Facebook / WhatsApp post (4:5)',1080,1350,null,'design'],['A4 flyer / poster',1240,1754,{w:210,h:297},'design'],['A5 flyer',874,1240,{w:148,h:210},'design'],['Invitation (portrait)',1080,1528,null,'design'],['YouTube thumbnail (16:9)',1280,720,null,'design']];
async function addTemplateImage(){
  const f=($('tf').files||[])[0],name=$('tn').value.trim();if(!f)return toast('Choose a design image (PNG/JPG)',true);if(!name)return toast('Enter a template name',true);
  const K=TPL_KINDS[+$('tk').value];const path='admin-templates/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');
  const up=await sb.storage.from('user-logos').upload(path,f,{cacheControl:'3600',upsert:false});if(up.error)return toast('Upload failed: '+up.error.message,true);
  const url=sb.storage.from('user-logos').getPublicUrl(path).data.publicUrl;
  const im=await new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>no(new Error('image load failed'));i.src=url}).catch(e=>null);if(!im)return toast('Could not read the image',true);
  const [W,H]=[K[1],K[2]];const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight);
  const page=JSON.stringify({version:'5.3.0',background:'#ffffff',objects:[{type:'image',version:'5.3.0',originX:'center',originY:'center',left:W/2,top:H/2,width:im.naturalWidth,height:im.naturalHeight,scaleX:sc,scaleY:sc,src:url,crossOrigin:'anonymous'}]});
  const c=document.createElement('canvas');const k=320/Math.max(W,H);c.width=Math.round(W*k);c.height=Math.round(H*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,(c.width-im.naturalWidth*sc*k)/2,(c.height-im.naturalHeight*sc*k)/2,im.naturalWidth*sc*k,im.naturalHeight*sc*k);
  let thumb=null;try{thumb=c.toDataURL('image/jpeg',0.8)}catch(e){}
  const r=await run(sb.from('studio_templates').insert({name,cat:$('tc').value.trim()||K[0].split(' (')[0],tags:$('tg').value.trim(),premium:$('tp').checked,thumb,doc:{kind:K[4],mm:K[3],width:W,height:H,pageIndex:0,pages:[page]}}),'Template added');if(!r.error)go('studiot')}
async function addCat(){const l=$('nc').value.trim();if(!l)return toast('Enter a name',true);const r=await run(sb.from('categories').insert({label:l,icon:$('ni').value.trim()||null}),'Added');if(!r.error)go('categories')}
async function addGraphic(){const u=$('gu').value.trim();if(!/^https?:\/\//.test(u))return toast('Enter an https image URL',true);const r=await run(sb.from('store_assets').insert({image_url:u,type:$('gt').value,enabled:true}),'Added');if(!r.error)go('graphics')}
async function uploadGraphics(){const fs=Array.from($('gf').files||[]);if(!fs.length)return toast('Choose image files',true);let ok=0;for(const f of fs){const path='admin-graphics/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');const up=await sb.storage.from('user-logos').upload(path,f,{cacheControl:'3600',upsert:false});if(up.error){toast(up.error.message,true);continue}const url=sb.storage.from('user-logos').getPublicUrl(path).data.publicUrl;const r=await sb.from('store_assets').insert({image_url:url,type:$('gt').value,enabled:true});if(r.error)toast(r.error.message,true);else ok++}toast(ok+' uploaded');go('graphics')}
async function addFont(){const l=$('fl').value.trim(),c=$('fc').value.trim(),u=$('fu').value.trim();if(!l||!c)return toast('Name and CSS family required',true);if(u&&!/^https:\/\/fonts\.googleapis\.com\//.test(u))return toast('Only Google Fonts links are allowed',true);const r=await run(sb.from('studio_fonts').insert({label:l,css:c,url:u}),'Added');if(!r.error)go('fonts')}
async function addPlan(){const id=$('np_id').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,''),name=$('np_name').value.trim(),price=Number($('np_price').value);if(!id||!name||!(price>0))return toast('ID, name and price are required',true);const n=v=>v===''?null:Number(v);const r=await run(sb.from('plans').insert({id,name,price,months:Number($('np_months').value)||1,download_limit:n($('np_dl').value),video_limit:n($('np_vl').value),note:$('np_note').value.trim()||null,active:true,sort:99}),'Plan added');if(!r.error)go('plans')}
async function saveSettings(){const patch={};document.querySelectorAll('#main [data-k]').forEach(i=>{const v=i.value.trim();patch[i.dataset.k]=v===''?null:(/^-?\d+(\.\d+)?$/.test(v)?Number(v):(v==='true'?true:(v==='false'?false:v)))});await run(sb.from('settings').update(patch).eq('id',1),'Settings saved')}
init();
</script></body></html>
